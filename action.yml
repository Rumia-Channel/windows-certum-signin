name: "Certum SimplySign Code Signing"
description: "Install SimplySign Desktop, authenticate with TOTP, dispatch code signing by file type, and verify signatures."
author: "Rumia-Channel"

branding:
  icon: "award"
  color: "blue"

inputs:
  certum-username:
    description: "SimplySign login/user ID."
    required: true
  certum-otp-uri:
    description: "Complete otpauth:// URI containing the SimplySign TOTP seed. Treat this as a long-lived secret."
    required: true
  certum-key-id:
    description: "SHA-1 thumbprint of the Code Signing certificate in CurrentUser\\My."
    required: true

  files:
    description: "Paths/globs separated by newlines or semicolons. By default each file is auto-dispatched by type."
    required: false
    default: ""
  signer:
    description: "Signer applied to every entry in files. auto, authenticode, powershell, java, nuget, clickonce, office-vba, or air."
    required: false
    default: "auto"
  targets:
    description: "Advanced per-target list. One line per target: signer::path/glob. AIR may use air::input.airi=>output.air."
    required: false
    default: ""

  timestamp-url:
    description: "Timestamp server used by supported signers."
    required: false
    default: "http://time.certum.pl"
  simplysign-url:
    description: "Direct URL of the SimplySign Desktop x64 MSI."
    required: false
    default: "https://files.certum.eu/software/SimplySignDesktop/Windows/9.4.3.90/SimplySignDesktop-9.4.3.90-64-bit-en.msi"
  capture-diagnostics:
    description: "Capture SimplySign screenshots on authentication failures. May expose the account identifier."
    required: false
    default: "false"

  java-pkcs11-slot:
    description: "SimplySign PKCS#11 slotListIndex used by jarsigner. Usually 0 when the account has one virtual card."
    required: false
    default: "0"
  java-pkcs11-pin:
    description: "Value passed to the PKCS#11 storepass parameter. SimplySign pinless cards still require a non-empty value."
    required: false
    default: "12345678"

  office-sips-path:
    description: "Path to the extracted x86 Microsoft Office Subject Interface Package. Required only for office-vba targets."
    required: false
    default: ""

  air-adt-path:
    description: "Optional path to AIR SDK adt/adt.bat. If omitted, PATH and AIR_HOME are searched."
    required: false
    default: ""

outputs:
  certificate-subject:
    description: "Subject of the certificate selected by certum-key-id."
    value: ${{ steps.cert.outputs.subject }}
  certificate-thumbprint:
    description: "Normalized certificate SHA-1 thumbprint."
    value: ${{ steps.cert.outputs.thumbprint }}

runs:
  using: "composite"
  steps:
    - name: Require Windows runner
      shell: pwsh
      run: |
        if (-not $IsWindows) {
          throw "windows-certum-signin requires a Windows runner."
        }

    - name: Install SimplySign Desktop
      shell: pwsh
      env:
        SIMPLYSIGN_URL: ${{ inputs.simplysign-url }}
      run: |
        & "${{ github.action_path }}\scripts\Install-SimplySign.ps1" -Url $env:SIMPLYSIGN_URL

    - name: Configure SimplySign
      shell: pwsh
      run: |
        & "${{ github.action_path }}\scripts\Configure-SimplySign.ps1"

    - name: Authenticate SimplySign
      shell: pwsh
      env:
        CERTUM_USERNAME: ${{ inputs.certum-username }}
        CERTUM_OTP_URI: ${{ inputs.certum-otp-uri }}
        CERTUM_KEY_ID: ${{ inputs.certum-key-id }}
        CAPTURE_DIAGNOSTICS: ${{ inputs.capture-diagnostics }}
      run: |
        & "${{ github.action_path }}\scripts\Connect-SimplySign.ps1"

    - name: Verify certificate availability
      id: cert
      shell: pwsh
      env:
        CERTUM_KEY_ID: ${{ inputs.certum-key-id }}
      run: |
        $thumbprint = ($env:CERTUM_KEY_ID -replace '[^0-9A-Fa-f]','').ToUpperInvariant()
        $cert = Get-ChildItem Cert:\CurrentUser\My -ErrorAction Stop |
          Where-Object { (($_.Thumbprint -replace '[^0-9A-Fa-f]','').ToUpperInvariant()) -eq $thumbprint } |
          Select-Object -First 1

        if (-not $cert) {
          throw "Certificate '$thumbprint' is not available in Cert:\CurrentUser\My after SimplySign authentication."
        }

        Write-Host "Certificate: $($cert.Subject)"
        Write-Host "Expires: $($cert.NotAfter.ToString('u'))"
        "subject=$($cert.Subject)" >> $env:GITHUB_OUTPUT
        "thumbprint=$thumbprint" >> $env:GITHUB_OUTPUT

    - name: Sign and verify targets
      if: ${{ inputs.files != '' || inputs.targets != '' }}
      shell: pwsh
      env:
        CERTUM_KEY_ID: ${{ inputs.certum-key-id }}
        SIGN_FILES: ${{ inputs.files }}
        SIGNER: ${{ inputs.signer }}
        SIGN_TARGETS: ${{ inputs.targets }}
        TIMESTAMP_URL: ${{ inputs.timestamp-url }}
        JAVA_PKCS11_SLOT: ${{ inputs.java-pkcs11-slot }}
        JAVA_PKCS11_PIN: ${{ inputs.java-pkcs11-pin }}
        OFFICE_SIPS_PATH: ${{ inputs.office-sips-path }}
        AIR_ADT_PATH: ${{ inputs.air-adt-path }}
      run: |
        & "${{ github.action_path }}\scripts\Sign-Targets.ps1" `
          -FileSpecs $env:SIGN_FILES `
          -Signer $env:SIGNER `
          -TargetSpecs $env:SIGN_TARGETS `
          -Thumbprint $env:CERTUM_KEY_ID `
          -TimestampUrl $env:TIMESTAMP_URL `
          -JavaPkcs11Slot ([int]$env:JAVA_PKCS11_SLOT) `
          -JavaPkcs11Pin $env:JAVA_PKCS11_PIN `
          -OfficeSipsPath $env:OFFICE_SIPS_PATH `
          -AirAdtPath $env:AIR_ADT_PATH
