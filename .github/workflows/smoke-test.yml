name: SimplySign smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: windows-latest
    environment: code-signing

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build disposable targets
        shell: pwsh
        run: |
          dotnet new console --name CertumSmokeTest --output smoke-src --force
          dotnet publish smoke-src `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output smoke-out
          Set-Content -LiteralPath smoke-out\signed-smoke.ps1 -Value 'Write-Output "signed"' -Encoding utf8

      - name: Sign with local action
        uses: ./
        with:
          certum-username: ${{ secrets.CERTUM_USERNAME }}
          certum-otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certum-key-id: ${{ secrets.CERTUM_KEY_ID }}
          targets: |
            auto::smoke-out\CertumSmokeTest.exe
            powershell::smoke-out\signed-smoke.ps1

      - name: Show Authenticode results
        shell: pwsh
        run: |
          Get-AuthenticodeSignature 'smoke-out\CertumSmokeTest.exe', 'smoke-out\signed-smoke.ps1' |
            Format-List Path, Status, StatusMessage, SignerCertificate, TimeStamperCertificate

      - name: Upload signed smoke artifacts
        uses: actions/upload-artifact@v5
        with:
          name: certum-smoke-test-signed
          path: |
            smoke-out\CertumSmokeTest.exe
            smoke-out\signed-smoke.ps1
